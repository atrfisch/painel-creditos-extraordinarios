name: Atualizar painel

# O site é servido direto da pasta docs/ do repositório
# (Settings -> Pages -> Deploy from a branch -> main -> /docs).
# Não há job de publicação: basta o commit, e o GitHub publica sozinho.

on:
  schedule:
    - cron: "0 9,21 * * 1-5"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a coletar, separados por espaço"
        default: "2026"
  push:
    branches: [main]
    paths:
      - "coleta/**"
      - "config/**"
      - "docs/index.html"
      - ".github/workflows/**"

permissions:
  contents: write

concurrency:
  group: painel-creditos
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      ANOS: ${{ github.event.inputs.anos || '2026' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar tesseract (OCR para anexos digitalizados)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por poppler-utils

      - run: pip install -r requirements.txt

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Instalar orcamentoBR
        run: Rscript -e 'install.packages("orcamentoBR")'

      - name: Coletar propostas do Congresso
        run: python coleta/congresso.py $ANOS

      - name: Baixar anexos das MPs
        run: python coleta/anexos.py
        continue-on-error: true

      - name: Calcular vigência
        run: python coleta/vigencia.py

      - name: Baixar execução do SIOP
        run: Rscript coleta/siop.R $ANOS
        continue-on-error: true

      - name: Consolidar créditos extraordinários
        run: python coleta/consolidar.py

      - name: Baixar anexos dos PLNs
        run: python coleta/anexos_plns.py
        continue-on-error: true

      - name: Consolidar suplementares e especiais
        run: PYTHONPATH=coleta python coleta/consolidar_plns.py
        continue-on-error: true

      - name: Conferir o pacote do site
        run: |
          test -f docs/index.html || { echo "::error::docs/index.html não existe"; exit 1; }
          test -f docs/plns.html || echo "::warning::docs/plns.html não existe — a aba de PLNs não será publicada"
          head -c 200 docs/index.html | grep -qi '<!doctype html' \
            || { echo "::error::docs/index.html não é HTML"; exit 1; }
          test -s docs/dados.json || { echo "::error::docs/dados.json vazio"; exit 1; }
          python -c "import json;d=json.load(open('docs/dados.json',encoding='utf-8'));print(len(d['medidas']),'medidas no arquivo')"

      - name: Publicar
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/dados.json docs/dados-plns.json config/anexos.json config/anexos_plns.json
          git diff --staged --quiet || git commit -m "dados: atualização automática $(date -u +%F\ %H:%M)"
          git push

      - name: Guardar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico
          path: |
            dados/uos.txt
            dados/uos_plns.txt
            dados/anexo_*.txt
            dados/siop_*.csv
          if-no-files-found: ignore
          retention-days: 7
